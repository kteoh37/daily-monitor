name: Review Japan policy updates

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/policy-events.json'
      - 'scripts/**'
      - '.github/workflows/policy-review.yml'
      - 'public/reports/japan-policy-events.html'
  workflow_dispatch:

# Validation only. This workflow has no write, merge or deployment capability.
permissions:
  contents: read

concurrency:
  group: policy-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r scripts/requirements.txt
      - name: Test policy safety and existing report pipelines
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Reject deleted history and stale corrections
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:data/policy-events.json" 2>/dev/null; then
            git show "$BASE_SHA:data/policy-events.json" > /tmp/policy-base.json
          else
            printf '{"schema_version":1,"events":[]}\n' > /tmp/policy-base.json
          fi
          python scripts/policy_events.py --base-registry /tmp/policy-base.json
      - name: Install PDF evidence reader
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify exact evidence on official sources
        run: |
          command -v pdftotext
          python scripts/policy_events.py --verify-sources --report public/reports/japan-policy-events.html --output /tmp/policy-preview.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
