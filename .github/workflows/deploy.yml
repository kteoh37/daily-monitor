name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Existing dashboard cadence stays at 13:00 and 22:00 UTC.
    - cron: '0 13 * * *'
    - cron: '0 22 * * *'
    # Thursday 10:00 America/New_York; plan selects exactly one across DST.
    - cron: '0 14 * * 4'
    - cron: '0 15 * * 4'
  workflow_dispatch:
    inputs:
      refresh_portfolio:
        description: 'Fetch live MOF and refresh the three portfolio PNGs from pinned Haver'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      refresh: ${{ steps.plan.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_portfolio_schedule.py
      - id: plan
        run: python3 scripts/portfolio_schedule.py
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          REQUESTED: ${{ inputs.refresh_portfolio }}

  build:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      portfolio_result: ${{ steps.portfolio.outputs.result }}
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Checkout Haver dataset (private)
        uses: actions/checkout@v4
        with:
          repository: kteoh37/haver-dataset
          path: haver-dataset
          ref: main
          token: ${{ secrets.HAVER_DATA_TOKEN }}

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Validate and build exact dashboard series
        shell: bash
        run: |
          python scripts/test_build_data_snapshot.py
          SOURCE_REVISION=$(git -C haver-dataset rev-parse HEAD)
          python scripts/build_data.py --haver-dataset haver-dataset --source-commit "$SOURCE_REVISION"

      - name: Test portfolio refresh safeguards
        run: python scripts/test_portfolio_report.py

      - name: Refresh portfolio from live sources
        id: portfolio
        if: ${{ needs.plan.outputs.refresh == 'true' }}
        shell: bash
        run: |
          SOURCE_REVISION=$(git -C haver-dataset rev-parse HEAD)
          set +e
          python scripts/refresh_portfolio_report.py --haver-data haver-dataset --source-commit "$SOURCE_REVISION"
          RESULT=$?
          set -e
          if [ "$RESULT" -ne 0 ] && [ "$RESULT" -ne 2 ]; then exit "$RESULT"; fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          python scripts/audit_portfolio_export.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/reports/japan-portfolio/index.html public/reports/japan-portfolio/manifest.json public/reports/japan-portfolio/portfolio_flows.png public/reports/japan-portfolio/portfolio_flows_recent.png public/reports/japan-portfolio/jsda/rolling_jgb_purchases.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh approved Japan portfolio charts and display status"
            git push origin HEAD:main
          fi
          echo "Portfolio refresh exit status: $RESULT (2 means partial; retained charts carry warnings)." >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh Japan policy report series
        shell: bash
        run: |
          python scripts/test_refresh_policy_report.py
          POLICY_SOURCE_REVISION=$(git -C haver-dataset rev-parse HEAD)
          python scripts/refresh_policy_report.py --haver-data haver-dataset --source-commit "$POLICY_SOURCE_REVISION"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_ACTIONS: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  portfolio-status:
    needs: [build, deploy]
    if: ${{ always() && needs.build.outputs.portfolio_result == '2' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "Portfolio refresh partially failed. Site shows retained charts and warnings. Inspect sanitized public manifest."
          exit 1
